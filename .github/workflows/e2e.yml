name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      # Pre-build the backend jar so that `mvn spring-boot:run` started by
      # Playwright's webServer is fast: it just executes the already-resolved
      # plugin/dependency graph.
      - name: Build backend
        working-directory: backend
        run: mvn -B -ntp -DskipTests package

      # Install frontend deps and (re)generate API types from the OpenAPI
      # contract so the dev server can serve a transpiled TypeScript app.
      - name: Install frontend deps and generate API types
        working-directory: frontend
        run: |
          npm ci
          npm run types:generate

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      # The OpenUI5 framework is downloaded on first `ui5 serve` — caching
      # the framework folder keeps subsequent CI runs from re-downloading.
      - name: Cache OpenUI5 framework
        uses: actions/cache@v4
        with:
          path: ~/.ui5/framework
          key: ui5-${{ runner.os }}-${{ hashFiles('frontend/ui5.yaml') }}
          restore-keys: ui5-${{ runner.os }}-

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # Playwright's webServer config in playwright.config.ts starts both the
      # backend (port 8081) and the frontend dev server (port 8080) and waits
      # for them to respond before running the suite.
      - name: Run e2e tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces and videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: e2e/test-results/
          retention-days: 7
